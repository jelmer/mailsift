[package]
name = "mailsift"
version = "0.1.0"
edition = "2024"
description = "Extracts structured artifacts (events, tickets, parcels, receipts, bills) from incoming personal email."
license = "GPL-3.0-or-later"

[features]
default = ["gssapi", "smtp"]
# Kerberos authentication: SASL `AUTHENTICATE GSSAPI` for IMAP and HTTP
# `Negotiate` for CalDAV. Requires a system GSSAPI library (MIT Kerberos
# or Heimdal) at link time.
gssapi = ["dep:libgssapi", "imap/gssapi"]
# SMTP submission for the receipts forwarder. Without it the sendmail
# pipe transport still works. Pulls in `lettre`'s MIME / encoding /
# TLS dep tree.
smtp = ["lettre/smtp-transport", "lettre/tokio1-rustls-tls"]
# JMAP (RFC 8620/8621) mailbox watcher (`mailsift jmap-watch`).
jmap = ["dep:jmap-client", "dep:futures-util"]
# Read-only HTTP dashboard for the artifact directories (`mailsift web`).
web = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tower", "dep:tower-service", "dep:utoipa", "dep:utoipa-axum", "dep:utoipa-swagger-ui"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"], optional = true }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
# Randomness for OAuth2 PKCE verifier + CSRF state.
getrandom = "0.2"
futures-util = { version = "0.3", default-features = false, optional = true }
# Cross-platform SIGINT/SIGTERM handler for the long-running daemons.
ctrlc = "3"
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"], optional = true }
icalendar = "0.16"
imap = { git = "https://github.com/jelmer/rust-imap", branch = "parse-error-variant", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16"
indicatif = "0.18"
indymilter = "0.3"
jmap-client = { version = "0.4", default-features = false, features = ["async", "aws_lc_rs"], optional = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "tokio1", "sendmail-transport"] }
libc = "0.2"
libgssapi = { version = "0.11", optional = true }
mailparse = "0.16.1"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
percent-encoding = "2"
quick-xml = "0.36"
regex = "1"
rayon = "1"
redb = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"], optional = true }
tower-service = { version = "0.3", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wait-timeout = "0.2"
iso_currency = "0.7.1"
utoipa = { version = "6", optional = true }
utoipa-axum = { version = "0.3", optional = true }
utoipa-swagger-ui = { version = "10", default-features = false, features = ["axum", "url"], optional = true }

[dev-dependencies]
assert_cmd = "2"
indymilter-test = "0.2.0"
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
# Accepts the multiparts without body parts that Gmail sends for some
# attachments.
imap-proto = { git = "https://github.com/jelmer/imap-proto", branch = "empty-multipart" }
